[package]
name = "cquisitor-lib"
version = "0.1.0-beta.58"
authors = ["Evgenii Lisitskii <evgeniilisitskii@gmail.com>"]
edition = "2018"
description = "Cardano transaction validation library"
license = "Apache-2.0"
include = [
    "src/**/*",
    "tsconfig.json",
    "Cargo.toml",
    "LICENSE",
    "README.md",
]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "generate_schemas"
path = "src/bin/generate_schemas.rs"

[features]
default = ["console_error_panic_hook"]

[dependencies]

# The `console_error_panic_hook` crate provides better debugging of panics by
# logging them with `console.error`. This is great for development, but requires
# all the `std::fmt` and `std::panicking` infrastructure, so isn't great for
# code size when deploying.
console_error_panic_hook = { version = "0.1.6", optional = true }

cardano-serialization-lib = { version = "15.0.3", features = [] }
schemars = "0.9.0"
serde = "1.0.217"
serde_json = { version = "1.0.136", features = [] }
hex = "0.4.3"
cryptoxide = "0.4.4"
uplc = "1.1.22"
pallas-codec = "0.35.1"
pallas-traverse = "0.35.1"
pallas-primitives = "0.35.1"
pallas-crypto = "0.35.1"
pallas-addresses = "0.35.1"
num-bigint = "0.4"
thiserror = "2"
blst = "0.3.13"
anyhow = "1.0.95"
itertools = { version = "0.14.0", features = [] }
bs58 = "0.5.1"
bech32 = "0.11.0"
base64 = "0.22.1"
wasm-bindgen = "0.2.92"
js-sys = "0.3.69"                                                                                               
cddl = { version = "0.10.5", default-features = false, features = [
    "std",
    "json",
    "cbor",
    "ast-span",
    "ast-comments",
    "additional-controls",
] }
ciborium = "0.2.2"
ciborium-io = "0.2.2"
ciborium-ll = "0.2.2"

[patch.crates-io]
cddl = { git = "https://github.com/lisicky/cddl.git", branch = "fix/cbor-validator-suite" }

[target.'cfg(not(all(target_arch = "wasm32", not(target_os = "emscripten"))))'.dependencies]
noop_proc_macro = "0.3.0"

[target.'cfg(all(target_arch = "wasm32", not(target_os = "emscripten")))'.dependencies]
wasm-bindgen = { version = "0.2.92", features = ["serde-serialize"] }
serde-wasm-bindgen = "0.6.5"

[profile.release]
# Tell `rustc` to optimize for small code size.
opt-level = "s"
